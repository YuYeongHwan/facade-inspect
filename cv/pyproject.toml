[project]
name = "facade-cv"
version = "0.1.0"
description = "드론 영상 기반 건물 창문 오염도 분석 (CV/학습/3D)"
requires-python = "==3.11.*"
dependencies = [
    "torch",
    "torchvision",
    "ultralytics",
    "opencv-python",
    "numpy",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "trimesh",
    "pycolmap>=4.2.1",
    "anomalib>=2.6.2",
    "pillow>=12.3.0",
    "albumentations>=2.0.8",
]

[project.optional-dependencies]
open3d = [
    "open3d>=0.20.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["facade_cv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 무거운 모델 테스트 (-m 'not slow'로 제외)"]
