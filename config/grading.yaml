# 창문 오염 심각도 지수 CSI (0~1)와 청소 우선순위 5단계 — 식·근거·예시는 docs/scoring.md
#   CSI = Σ_j (A_j × k_s(j) × k_t(j)) / (A_g × k_s_max × k_t_max)
# 구조: 외벽 열화 심각도 지수 [R2] (면적 × 상태 등급 × 유형 가중치 / (전체 면적 × 최고 등급)), 지수 → 등급 구간 [R4]
#
# ⚠️ 아래 수치(k_t, 심각도 ΔE 경계, level 경계)는 모두 **보정 전 초기값**이다. 문헌 값이 아니며 실측으로 검증되지 않았다.
#    사람 평가로 보정: python -m facade_cv.contamination.calibrate fit ... (docs/scoring.md "보정")
status: 보정 전 초기값

# A_g (유리 면적) = 창문 crop − 창틀 마진 − 가림(occlusion: 나무·전선·기둥, detect.postprocess)
frame_margin: 0.06      # 정면화 crop 각 변에서 이 비율만큼을 창틀로 보고 제외 (crop 폭·높이 대비)

# k_t: 오염 종류 가중치 [R6 — 종류마다 투과율 손실 기울기가 다르다는 근거. 수치는 자체 초기값]
# CSI는 k_t_max(= 이 중 최댓값)로 나누므로 상대 크기만 의미가 있다
weights:
  dust: 0.5
  stain: 0.8
  grime: 1.0
  heavy: 1.5

# k_s: 심각도 1~3 = 영역 평균색과 주변 깨끗한 유리 평균색의 CIELAB 색차 ΔE*ab [R22] (불투명도의 대리 지표 [R5])
# ΔE < 6 → 1 (옅음: 근거리에서야 보임), 6 ≤ ΔE < 15 → 2 (뚜렷함), ΔE ≥ 15 → 3 (불투명에 가까움)
# 경계 6은 지각 가능 최소 색차(JND ≈ 2.3 [R23])의 약 2.5배 — 드론 영상 압축·조명 변화를 넘는 차이만 오염 농도로 보려는 자체 초기값
severity:
  delta_e: [6.0, 15.0]  # k_s 2, 3의 ΔE 하한
  max: 3                # k_s_max
  clean_min_ratio: 0.05 # 깨끗한 유리(오염·가림 아닌 유리) 픽셀이 A_g의 이 비율보다 적으면 기준색을 못 정한다 → 전 영역 k_s = max

# 청소 우선순위 5단계 (지수 → 구간별 등급 라벨: PCI [R4] 방식). min_csi = 그 level의 CSI 하한 (level 1은 0, 오름차순)
# 경계값은 상위 level에 포함. 초기값 = 이전 score 경계(0.02/0.05/0.10/0.20)를 중간 심각도(k_s=2) 가정으로 환산:
#   CSI = score × 2 / (3 × 1.5) = score × 0.444 → 0.009 / 0.022 / 0.044 / 0.089
# 라벨·색·min_csi는 web/lib/palette.ts LEVEL_STYLES와 같아야 한다 (cv/tests/test_schema.py가 검사)
levels:
  - {level: 1, label: 청소 불필요, min_csi: 0.0, color: "#22c55e"}
  - {level: 2, label: 경과 관찰, min_csi: 0.009, color: "#84cc16"}
  - {level: 3, label: 가급적 청소, min_csi: 0.022, color: "#eab308"}
  - {level: 4, label: 청소 필요, min_csi: 0.044, color: "#f97316"}
  - {level: 5, label: 우선 청소, min_csi: 0.089, color: "#ef4444"}
