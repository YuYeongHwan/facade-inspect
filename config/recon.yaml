# facade_cv.recon3d — 3D 복원 (박스 메시 + 외벽 정사영 텍스처 + 창문 패널)
# 프레임 샘플링은 config/extract.yaml (facade_cv.io.extract). 길이 임계값은 장면 크기(scene) 비율:
# scene = 포인트에서 가장 가까운 카메라까지 거리의 중앙값 = 촬영 거리 (scale_known=false라 절대 단위가 없다).
# SfM 깊이 잡음은 촬영 거리에 비례한다. 포인트 상자 대각선을 쓰면 긴 외벽을 따라 걸은 영상(b04: 길이 9 × 높이 1.3)에서
# 임계값이 벽 높이의 10%가 되어 벽을 비스듬히 자르는 '거의 수평' 평면이 진짜 벽보다 inlier가 많아졌다.
sfm:
  camera_model: OPENCV          # 휴대폰(아이폰). SIMPLE_RADIAL은 b04에서 긴 직선 외벽이 휘었다 (k1만으로 왜곡 부족).
                                # 드론 FPV 160° 광각: OPENCV_FISHEYE
  single_camera: true           # 모든 프레임이 같은 내부 파라미터. 아이폰 손떨림 보정(프레임마다 화각 변동)이면 false 시도
  max_num_features: 8192
  matcher: sequential           # sequential (영상) | exhaustive
  sequential_overlap: 20        # 10이면 나무 기둥이 몇 프레임 가리는 곳에서 모델이 둘로 갈라졌다 (b04)
  loop_detection: false         # true면 vocab_tree_path 필요 (COLMAP 사이트의 vocab tree 파일)
  vocab_tree_path: null
  mapping_trials: 3             # 매핑은 실행마다 결과가 달라 (모델이 둘로 갈라지기도) — 시드를 바꿔 최대 N번,
  mapping_target_ratio: 0.95    #   등록률이 이 이상이면 바로 멈추고 가장 많이 등록된 모델을 쓴다 (특징·매칭은 재사용)
  abs_pose_min_num_inliers: 15  # 새 프레임 등록 최소 inlier (COLMAP 기본 30). b04: 30이면 나무 기둥이 가린 3~4프레임에서
  abs_pose_min_inlier_ratio: 0.15  #   모델이 둘로 갈라져 등록 39~43/80 → 15/0.15면 80/80 (시드 3개 모두). 기본 0.25
  min_registered: 6             # 등록 프레임이 이보다 적거나
  min_registered_ratio: 0.3     # 등록률이 이보다 낮으면 degrade 모드
planes:
  outlier_neighbors: 20         # 통계적 이상치 제거: k 이웃 평균 거리
  outlier_std_ratio: 2.0        #   > 전체 평균 + std_ratio × 표준편차면 제거
  ransac_iters: 2000
  distance_ratio: 0.03          # 평면 inlier 거리 = scene × 이 값
  min_inlier_ratio: 0.03        # 평면 inlier가 전체 포인트의 이 비율 미만이면 반복 종료
  max_planes: 10                # RANSAC 반복 최대 횟수 (수직이 아닌 지면·나무 평면 포함)
  vertical_tol_deg: 15          # 법선이 수평에서 이 각 이내여야 facade 후보
  merge_angle_deg: 15           # 같은 방향 (부호 무시 — 법선 방향은 병합 뒤에 정한다) 이고
  merge_offset_ratio: 0.1       #   평면 거리 차 < scene × 이 값이면 한 면으로 병합
  orthogonal_tol_deg: 25        # 2~4면: 공통 직교 격자 방향에서 이 각 이내면 스냅, 넘으면 extra(보고만)
  max_facades: 4
  ground_percentile: 2          # 지면 높이 = facade 포인트 높이(y) 하위 백분위
  top_percentile: 98            # 지붕 높이 = 상위 백분위
  extent_percentile: [2, 98]    # 외벽 가로 범위 = facade inlier u 좌표 백분위
  up_refine_tol_deg: 35         # 업벡터 보정(up_axis.refine_up)에 쓸 "대략 수직" 평면: 법선이 수평에서 이 각 이내
  up_refine_iters: 10
  relief_bins: 24               # 외벽 깊이 프로필 δ(u) 구간 수 — 휜 벽 (직선 경로 촬영)을 따라 텍스처·창문을 놓는다
  min_tilt_fix_deg: 0.5          # 면 1개: 창문 세로 변의 기울기 중앙값이 이보다 크면 그만큼 업벡터를 면 안에서 돌린다
mesh:
  wall_thickness_ratio: 0.05    # 1~2면 벽 판 두께 = 그 면 min(폭, 높이) × 이 값
ortho:
  max_side_px: 2048             # 외벽 텍스처 긴 변
  top_k: 5                      # texel마다 가장 정면으로 본 뷰 K개의 median (반사·가림 감소)
  min_cos: 0.3                  # 시선과 외벽 법선 cos이 이보다 작으면 (너무 비스듬) 사용 안 함
  jpeg_quality: 92
windows3d:
  top_margin_ratio: 0.1         # 외벽 높이 ≥ 창문 윗변 95백분위 × (1 + 이 값) (위층 민무늬 벽은 SfM 점이 적다)
  min_observations: 2           # 이보다 적은 프레임에서만 보인 창문은 버림 (오검출)
  cluster_dist_ratio: 0.8       # 같은 창문 = 중심 거리 < 창문 크기 중앙값 × 이 값 (평면 좌표). b04 스윕: 0.5면 같은 창문이 갈라짐
  max_inside_margin: 0.1        # 투영 코너가 facade 범위 밖으로 이 비율 (폭·높이 대비) 넘게 나가면 다른 면
  # row/col = 창문 중심 밀도의 봉우리 (windows3d.grid_labels). size = 창 높이(행)·폭(열) 중앙값
  grid_bandwidth_ratio: 0.25    # 밀도 가우시안 폭 = size × 이 값
  grid_peak_ratio: 0.25         # 가장 높은 봉우리 × 이 값 미만 봉우리는 버림 (층 사이 오검출)
  grid_min_sep_ratio: 1.0       # 더 높은 봉우리에서 size × 이 값 안의 봉우리는 버림
  crop_px_per_unit: null        # 창문 crop 해상도. null = 외벽 텍스처와 같게
path:
  straight_ratio: 0.15          # 카메라 궤적 수평 PCA 둘째/첫째 표준편차 < 이 값이면 "직선 경로" 경고 (깊이 불확실)
degrade:
  facade_height: 10.0           # 가상 평면 높이 (상대 단위)
